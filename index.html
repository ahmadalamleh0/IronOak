<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android / PWA -->
    <meta name="theme-color" content="#07111D" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IronOak Property Services Inc. | Property Services Toronto & GTA</title>
    <meta name="description" content="IronOak Property Services Inc. provides complete property services across Toronto and the GTA, including property maintenance, interior and exterior finishing, cleaning, CCTV security solutions, repairs, and capital projects for commercial, condominium, residential, and managed properties." />
    <link rel="canonical" href="https://www.ironoakproperties.ca/" />

    <!-- Open Graph / social sharing -->
    <!-- og:image / twitter:image / og:url use the same production origin as the
         SITE_URL constant in src/config/site.js, since social crawlers (incl.
         WhatsApp) require an absolute URL, not a relative path. Update both
         places together if the production domain changes. -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="IronOak Property Services Inc. | Property Services Toronto & GTA" />
    <meta property="og:description" content="IronOak Property Services Inc. provides complete property services across Toronto and the GTA, including property maintenance, interior and exterior finishing, cleaning, CCTV security solutions, repairs, and capital projects for commercial, condominium, residential, and managed properties." />
    <meta property="og:url"         content="https://www.ironoakproperties.ca/" />
    <meta property="og:image"       content="https://www.ironoakproperties.ca/images/ironoak-social-preview-v2.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="IronOak Property Services Inc. | Property Services Toronto & GTA" />
    <meta name="twitter:description" content="IronOak Property Services Inc. provides complete property services across Toronto and the GTA, including property maintenance, interior and exterior finishing, cleaning, CCTV security solutions, repairs, and capital projects for commercial, condominium, residential, and managed properties." />
    <meta name="twitter:image"       content="https://www.ironoakproperties.ca/images/ironoak-social-preview-v2.jpg" />
    <!-- Preload the homepage LCP background so it's ready the moment the logo
         reveal exits. Matches the media query in Hero.jsx's .hero-bg-img rule
         exactly, so each device fetches only its own file — never both. -->
    <link rel="preload" as="image" href="/images/hero-bg-mobile.webp" fetchpriority="high" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/hero-bg.webp" fetchpriority="high" media="(min-width: 769px)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical fonts first (Inter Tight + Manrope), decorative fonts deferred -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,900;1,900&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Alfa+Slab+One&family=Bebas+Neue&family=Pinyon+Script&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
